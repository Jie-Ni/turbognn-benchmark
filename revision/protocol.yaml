artifacts:
  format: json_gzip
  atomic_write: true
  required_input_hashes:
    [dataset, protocol, dataset_passport, condition_panel_manifest,
     target_encoding_audit, preflight_summary, environment_manifest,
     environment_lock, git_provenance, nested_gene_panel_manifest,
     shared_control_cell_evidence,
     precision_design_registry, precision_archive_condition_table,
     precision_target_map, hyperparameter_provenance]
  required_fields:
    - gene_names
    - y_true
    - y_pred
    - train_loss
    - validation_loss
    - learning_rate
    - vector_space
    - config
    - config_hash
    - input_hashes
    - graph_support_hash
    - preprocessing_state_hash
    - architecture_hash
    - initialization_hash
    - code_hash
    - checkpoint_path
    - checkpoint_hash
    - runtime
  checkpoint_validation:
    safe_decode_required: true
    cross_bindings:
      [identity, full_config_hash, input_hashes_hash, architecture,
       graph_support_hash, preprocessing_state_hash, code_hash,
       git_commit, git_worktree_status, git_status_hash, vector_space,
       gene_names_hash, initialization_hash, best_epoch,
       early_stopping_observation, deterministic_backend]

environment_lock:
  format: cbac-complete-pip-freeze-v2
  required_runtime_headers:
    [python-version, cuda-runtime-version, cudnn-version, nvidia-driver-version,
     pytorch-version, pytorch-geometric-version,
     complete-distribution-set-sha256, direct-runtime-dependencies-sha256,
     pyg-extension-versions-sha256]
  package_policy: exact_complete_active_distribution_set_and_versions
  direct_dependency_source: pyproject_runtime_model_and_h5ad_dependencies
  production_h5ad_requires_h5py: true
  placeholder_policy: hard_failure

git_provenance:
  base_commit: exact_40_lowercase_hex
  worktree_status: [CLEAN, DIRTY]
  dirty_state_policy: path_redacted_porcelain_status_hash_and_entry_count
  code_tree_hash_required: true
  bound_to_each_fold_artifact: true

release_registry:
  exact_result_lock_count: 13
  exact_result_lock_ids:
    [PRIMARY-DELTA-R, PRIMARY-UNCERTAINTY-INTERVAL, PRIMARY-DECISION,
     PROPAGATION-CONTROL, SCALE-INTERACTION, TOPOLOGY-NULL,
     REPRESENTATIVENESS-TRIGGER, CONDITIONAL-PANEL, FRACTION-IMPROVED,
     EMPIRICAL-SEED-RESOLUTION, SECONDARY-METRICS, EXTERNAL-COMPARATOR-VALIDATION,
     MEASURED-COMPUTE]
  mandatory_fit_coverage_cascades_to_numeric_locks: true
  not_triggered_is_valid_for:
    [REPRESENTATIVENESS-TRIGGER, CONDITIONAL-PANEL]
  empirical_seed_resolution_role: descriptive_parallel_audit_not_primary_threshold
  source_values_rendering:
    modes: [author-review, released]
    exact_lock_macro_count: 13
    released_mode_requires_all_locks_released: true
    self_hashed_round_trip_manifest_required: true
    manual_transcription_policy: prohibited
    numeric_json_type_policy: number_only_bool_and_numeric_strings_rejected
    nonfinite_numeric_policy: rejected
    display_rounding: decimal_round_half_up
    primary_point_inside_ci_required: true
    primary_decision_recomputed_from_unrounded_ci: true
    primary_decision_reference: zero_only
    archived_optimisation_repeatability_reference_has_success_authority: false
    cross_lock_biological_claim_gate_required: true
  release_assets:
    modes: [author-review, released]
    released_mode_missing_asset_policy: WITHHELD
    semantic_round_trip_required: true
    manifest_self_hash_required: true
    formats: [csv, tex, svg, pdf]
    required_asset_groups:
      [primary_summary_and_forest, paired_condition_distribution,
       fraction_improved_interval, target_sensitivity, topology_instances_and_diagnostics,
       scale_native_and_common200, propagation, representativeness_and_conditional,
       secondary_ranking_and_multiplicity, baseline_absolute_skill,
       compute_and_failure_denominators, external_diagnostics_and_exclusions]
  main_release_trust_boundary:
    anchor_id: CBAC-MAIN-RELEASE-TRUST-V1
    mode: caller_pinned_detached_file_sha256
    detached_from_evidence_bundle_required: true
    caller_pinned_sha256_required: true
    synchronized_bundle_rewrite_policy: WITHHELD
    author_review_anchor_policy: absent_no_placeholder_anchor
    trusted_categories:
      [dataset_passports, dataset_files, graph_files, string_go_source_and_policy,
       split_condition_target_order, protocol, entrypoint_environment,
       raw_predictions_traces, baseline_inputs, precision_simulation_inputs,
       topology_diagnostics, release_asset_manifest]
    caller_control_plane_boundary: caller_hash_must_be_immutable_to_bundle_attacker

measured_compute:
  attempt_ledger: append_only_across_invocations_by_exact_fit_key
  attempt_start_persistence: STARTED_UNFINALIZED_written_atomically_before_fit
  unresolved_started_attempt_policy: block_resume_until_operator_resolution
  orphan_ledger_policy: detect_newer_content_addressed_ledger_and_block
  required_phase_seconds:
    [training, inference, checkpoint_io, other_overhead, useful_compute,
     failed_attempt, retry_overhead]
  required_hardware_fields:
    [accelerator_model, accelerator_count, cpu_model, logical_cpu_count,
     host_ram_bytes]
  completed_fit_retry_policy: skip_existing_success_and_retain_prior_failures
  successful_attempt_policy: exactly_one_success_and_success_is_final_attempt_per_fit_key
  timing_scope: setup_training_inference_checkpoint_io_excludes_artifact_json_and_ledger_publish

external_positive_control:
  system: GEARS
  official_repository: https://github.com/snap-stanford/GEARS
  pinned_commit: f374e43e197b295016d80395d7a54ddb81cc6769
  official_metric_source: gears/inference.py
  official_metric_function: gears.inference.compute_metrics
  manifest_and_hash_verified_reference_required: true
  missing_or_placeholder_policy: WITHHELD
  tolerance_policy: explicit_per_metric_absolute_relative_and_justification
  raw_evidence_required:
    [prediction_vectors, truth_vectors, de_prediction_vectors, de_truth_vectors,
     reported_metrics, baseline_metrics, training_loss, validation_loss,
     gene_order, perturbable_gene_order, condition_target_indices,
     condition_target_indicators, identifier_coverage, target_mapping_audit]
  phase_roles:
    official_reference: official_reference
    candidate: heldout_adaptation
  expected_value_provenance_cross_bindings:
    [phase_role, expected_metrics, repository_url, commit, dataset_sha256,
     split, entrypoint_sha256, argv_sha256, frozen_before_execution]
  identical_workflow_policy: explicit_pinned_reuse_and_distinct_provenance_required
  official_metric_recomputation_required: true
  semantic_diagnostic_gates:
    prediction_nondegeneracy: strictly_positive_prediction_standard_deviation
    baseline_superiority: strictly_positive_directional_improvement_for_every_metric
    training_loss_improvement: first_epoch_minus_final_epoch_strictly_positive
    validation_loss_improvement: first_epoch_minus_final_epoch_strictly_positive
    reader_null_pass_policy: prohibited
  trust_boundary:
    mode: caller_pinned_sha256_over_detached_anchor_and_external_sources
    detached_anchor_must_be_outside_evidence_bundle: true
    caller_pinned_anchor_sha256_required: true
    trusted_external_sources:
      [environment_lock, execution_plan, dataset, official_metric_source,
       phase_entrypoints, phase_expected_value_provenance, phase_execution_audits,
       phase_raw_evidence, phase_initialization_state, phase_checkpoint_state,
       phase_graph_state, phase_outputs]
    independent_recomputation_required:
      [environment_lock_structure, execution_plan_self_hash, dataset_content_hash,
       phase_roles, expected_value_provenance, gene_order,
       perturbable_gene_order, condition_target_indices,
       condition_target_indicators, graph_semantic_bindings]
    synchronized_bundle_rewrite_policy: WITHHELD
    caller_control_plane_boundary: caller_pinned_sha256_must_be_immutable_to_bundle_attacker
  eligibility_branches:
    valid_and_within_tolerance: ELIGIBLE_POSITIVE_CONTROL_PASSED
    valid_but_outside_tolerance: EXCLUDED_FAILED_POSITIVE_CONTROL
    invalid_or_incomplete_evidence: WITHHELD_INVALID_OR_INCOMPLETE_EVIDENCE

external_comparator_validity_family:
  headline_lock_id: EXTERNAL-COMPARATOR-VALIDATION
  members: [GEARS, scGPT, Geneformer]
  allowed_member_decisions: [PASS, EXCLUDED, WITHHELD]
  family_release_requires_no_withheld_member: true
